<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <title>DeepFlow — Underwater Meditation</title>
  <meta name="description" content="Immersive underwater meditation experience" />
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <!-- aframe-extras: WASD-movement and look-controls -->
  <script src="https://cdn.jsdelivr.net/gh/c-frame/aframe-extras@7.5.4/dist/aframe-extras.min.js"></script>

  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/cursor-override.css" />

  <!-- Script initialization -->
  <script src="js/swim-bob.js"></script>
  <script src="js/marine-snow.js"></script>
  <script src="js/boundary-clamp.js"></script>
  <script src="js/fish.js"></script>
  <script src="js/video.js"></script>
  <script src="js/glowy-egg.js"></script>
  <script src="js/orca-info-popup.js"></script>
  <script src="js/manta-info-popup.js"></script>
  <script src="js/gardineroseris-info-popup.js"></script>
  <script src="js/meditation-click.js"></script>
  <script src="js/meditation-attractor.js"></script>
  <script src="js/meditation-mode.js"></script>
  <script src="js/soundplayer.js"></script>
  <script src="js/breathing-ring.js"></script>
  <script src="js/main.js"></script>
</head>

<body>

  <button id="soundToggle" class="sound-button"></button>

  <a-scene meditation-mode fog="type: exponential; color: #08506b; density: 0.025" background="color: #0a3d5c">
    <a-assets>
      <video id="underwater-video" src="assets/video/underwater.mp4" autoplay loop muted playsinline></video>

      <!-- Fish models -->
      <a-asset-item id="emperor-fish" src="assets/models/emperor_angelfish_update_v2.glb"></a-asset-item>
      <a-asset-item id="manta-ray" src="assets/models/manta_ray_birostris_animated.glb"></a-asset-item>
      <a-asset-item id="fish-school"
        src="assets/models/animated_swimming_tropical_fish_school_loop_compressed.glb"></a-asset-item>
      <a-asset-item id="tuna-fish" src="assets/models/animated_tuna__3d_animal_model.glb"></a-asset-item>
      <a-asset-item id="orca" src="assets/models/female_orca_compressed.glb"></a-asset-item>
      <a-asset-item id="fish" src="assets/models/fish.glb"></a-asset-item>

      <!-- Native HTML5 audio element -->
      <audio id="underwaterSound" src="assets/audio/underwater-river-rapids-in-winter-ivo-vicic-1-03-01.mp3"
        preload="auto"></audio>
      <img id="soundOnIcon" src="assets/images/soundon.svg">
      <img id="soundOffIcon" src="assets/images/soundoff.svg">
    </a-assets>

    <!-- Default lighting -->
    <a-light type="ambient" color="#ffffff" intensity="0.8"></a-light>
    <a-light type="directional" color="#ffffff" intensity="0.4" position="-1 2 1"></a-light>

    <!-- Videosphere background -->
    <a-videosphere src="#underwater-video" radius="50" rotation="0 180 0" scale="-1 0.4 1"
      material="fog: false"></a-videosphere>

    <!-- Static environment objects -->
    <a-gltf-model id="boat" src="assets/models/bateau_riva_boat_compressed.glb" position="-3.128 20.031 0.150"
      rotation="-4.282 63.800 0.584" scale="2 2 2.467"></a-gltf-model>
    <a-gltf-model id="pier" src="assets/models/pier.glb" position="-31.58 13.940 -1.893" rotation="-19.33 89.772 1.954"
      scale="1 1 1.2"></a-gltf-model>
    <a-gltf-model id="underwater-rock-tunnel" src="assets/models/underwater_rock_tunnel_compressed.glb"
      position="-70.07 -21.49 1.312" rotation="0 99.342 0" scale="0.1 0.1 0.190">
      <a-gltf-model id="coral" src="assets/models/lowpoly_coral_pack_compressed.glb" position="-156.3 56.414 325.46"
        rotation="0 -65.80 0" scale="10 10 10"></a-gltf-model>
    </a-gltf-model>

    <!-- Static plants and coral on the seabed -->
    <a-entity id="gardineroseris" position="14.0 -18.8 0.5" rotation="0 40 0" scale="0.35 0.35 0.35" gardineroseris-info-popup>
      <a-gltf-model gltf-model="assets/models/gardineroseris_planulata_compressed.glb" class="clickable"></a-gltf-model>

      <!-- Clickable marker positioned on top of the Gardineroseris plant -->
      <a-entity position="2.568 3.830 3.390" class="clickable gard-marker">
        <a-entity animation="property: rotation; to: 0 360 0; dur: 6000; loop: true; easing: linear">
          <a-torus radius="0.5" radius-tubular="0.05" material="color: #00ffff; emissive:  #00ffff; emissiveIntensity: 0.95; transparent: true; opacity: 0.98; side: double"
            animation="property: scale; from: 1 1 1; to: 1.18 1.18 1.18; dir: alternate; dur: 900; loop: true; easing: easeInOutSine">
          </a-torus>
        </a-entity>
        <a-text value="Click Plant" align="center" color="#e8ffe8" width="1.6" position="0 0 0" look-at="[camera]"></a-text>
      </a-entity>
    </a-entity>
    <a-gltf-model id="base-seaweed" src="assets/models/base_seaweed.glb" position="17.8 -17.65 -5.2" rotation="0 100 0"
      scale="1.3 1.3 1.3"></a-gltf-model>
    <a-gltf-model id="wiggle-seaweed" src="assets/models/wiggle_seaweed.glb" position="15.0 -18.7 -4.5"
      rotation="0 85 5" scale="1.4 1.4 1.4"></a-gltf-model>
    <a-gltf-model id="tall-seaweed" src="assets/models/tall_seaweed.glb" position="6.0 -18.5 -8.2" rotation="0 60 0"
      scale="1.7 1.7 1.7"></a-gltf-model>


    <a-gltf-model id="base-seaweed" src="assets/models/base_seaweed.glb" position="13.8 -17.65 -5.2" rotation="0 100 0"
      scale="1.3 1.3 1.3"></a-gltf-model>
    <a-gltf-model id="wiggle-seaweed" src="assets/models/wiggle_seaweed.glb" position="25.0 -16.19 -4.5"
      rotation="0 85 5" scale="1.4 1.4 1.4"></a-gltf-model>
    <a-gltf-model id="tall-seaweed" src="assets/models/tall_seaweed.glb" position="12.0 -18.5 -8.2" rotation="0 60 0"
      scale="1.7 1.7 1.7"></a-gltf-model>

    <a-gltf-model id="base-seaweed" src="assets/models/base_seaweed.glb" position="17.8 -17.65 -5.2" rotation="0 100 0"
      scale="1.3 1.3 1.3"></a-gltf-model>
    <a-gltf-model id="wiggle-seaweed" src="assets/models/wiggle_seaweed.glb" position="15.0 -18.7 -4.5"
      rotation="0 85 5" scale="1.4 1.4 1.4"></a-gltf-model>
    <a-gltf-model id="tall-seaweed" src="assets/models/tall_seaweed.glb" position="6.0 -18.5 -8.2" rotation="0 60 0"
      scale="1.7 1.7 1.7"></a-gltf-model>


    <a-gltf-model id="base-seaweed" src="assets/models/base_seaweed.glb" position="13.8 -17.65 -5.2" rotation="0 100 0"
      scale="1.3 1.3 1.3"></a-gltf-model>
    <a-gltf-model id="wiggle-seaweed" src="assets/models/wiggle_seaweed.glb" position="25.0 -16.19 -4.5"
      rotation="0 85 5" scale="1.4 1.4 1.4"></a-gltf-model>
    <a-gltf-model id="tall-seaweed" src="assets/models/tall_seaweed.glb" position="12.0 -18.5 -8.2" rotation="0 60 0"
      scale="1.7 1.7 1.7"></a-gltf-model>

    <!-- Marine snow (plankton) -->
    <a-entity marine-snow="speed: 0.1"></a-entity>

    <a-entity
      school-splitter="model: #fish-school; multiplier: 3; boundary: 25; minSpeed: 2.0; maxSpeed: 4.5; scale: 1.2"></a-entity>
    <a-entity
      gltf-fish-spawner="model: #emperor-fish; count: 4; boundary: 25; minSpeed: 1.5; maxSpeed: 3.5; scale: 1.0"></a-entity>
    <a-entity
      gltf-fish-spawner="model: #manta-ray; count: 1; boundary: 25; minSpeed: 1.0; maxSpeed: 2.0; scale: 0.7; modelRotation: 0 0 180"></a-entity>
    <a-entity
      gltf-fish-spawner="model: #tuna-fish; count: 3; boundary: 25; minSpeed: 1.0; maxSpeed: 2.0; scale: 0.7"></a-entity>

    <!-- ORCA WITH NESTED GLOWY EGG -->
    <a-entity id="orca-entity" orca-info-popup position="0 4 -10" fish-swim="speed: 1.5; boundary: 25">
      <a-gltf-model class="clickable" src="#orca" scale="0.1 0.1 0.1"
        animation-mixer="clip: *; loop: repeat"></a-gltf-model>

      <a-entity class="clickable" glowy-egg="glowColor: #00ffff; glowIntensity: 1.8; pulseSpeed: 1.5; scale: 2.5"
        position="0 0.5 0">
      </a-entity>
    </a-entity>

    <!-- Meditation point -->
    <a-entity id="meditation-point" position="4.918 -5.816 -7.547" scale="0.863 0.863 0.863" meditation-click
      meditation-attractor="triggerDistance: 25; hintDistance: 25; pulseSpeed: 0.3; pulseAmount: 0.15">
      <a-sphere class="clickable" radius="2" color="#00d4aa"
        material="transparent: true; opacity: 0; depthWrite: false"></a-sphere>

      <a-text class="attractor-hint" value="[K] Meditate" position="0 2.5 0" align="center" color="#ffffff" width="6"
        opacity="0"></a-text>

      <a-entity animation="property: rotation; to: 0 360 0; dur: 8000; loop: true; easing: linear">
        <a-torus radius="1.5" radius-tubular="0.04" color="#00d4aa" opacity="0.5"></a-torus>
      </a-entity>
      <a-entity animation="property: rotation; to: 360 0 0; dur: 5000; loop: true; easing: linear">
        <a-torus radius="0.8" radius-tubular="0.03" color="#7eb8f7" opacity="0.6"></a-torus>
      </a-entity>
      <a-entity animation="property: rotation; to: 0 0 360; dur: 5000; loop: true; easing: linear">
        <a-torus radius="0.4" radius-tubular="0.02" color="#ffffff" opacity="0.7"></a-torus>
      </a-entity>
    </a-entity>

    <!-- Ambient Soundtrack component set to autoplay immediately -->
    <a-entity id="soundPlayer" sound="src: #underwaterSound; loop: true; volume: 3.8" sound-player></a-entity>

    <!-- Player Rig -->
    <a-entity id="player" position="18.304 -2 17.834" rotation="0 53.330 0" wasd-controls="acceleration: 65; fly: true"
      swim-bob="amplitude: 0.1; frequency: 0.3" boundary-clamp="radius: 28">
        <a-entity camera look-controls>
        <a-entity id="soundToggleVR" position="0.8 -0.4 -1.5" visible="false">
          <a-image id="soundToggleIcon" class="clickable" src="#soundOnIcon" width="0.18" height="0.18" opacity="0.95"
            visible="false"></a-image>
        </a-entity>
        <a-entity cursor="rayOrigin: mouse" raycaster="objects: .clickable; far: 100;"></a-entity>

        <!-- Meditation panel — attached to camera so it follows the view -->
        <a-entity id="meditation-panel" visible="false" position="0 0 -2">
          <a-entity class="breathing-ring"
            breathing-ring="count: 100; radius: 0.26; size: 0.022; rotateSpeed: 0.3; rings: 3; ringSpacing: 0.035"></a-entity>

          <a-text class="instruction-text" value="" position="0 0.65 0" align="center" width="2.2" color="#cfe7f0"
            opacity="0" wrap-count="22"></a-text>

          <a-text class="phase-text" value="" position="0 0 0" align="center" width="1.6" color="#cfe7f0"
            opacity="0"></a-text>

          <a-entity class="clickable exit-btn" position="0 -0.53 0">
            <!-- <a-plane width="0.78" height="0.2" color="#55c8ff" opacity="0.35" material="transparent: true"></a-plane>
            <a-plane width="0.76" height="0.18" color="#000000" opacity="0.45" material="transparent: true"
              position="0 0 0.001"></a-plane> -->
            <a-text value="Exit (ESC)" position="0 0 0.01" align="center" width="4" wrap-count="30" color="#a0d8ec"></a-text>
          </a-entity>
        </a-entity>
      </a-entity>

      <!-- VR controllers -->
      <a-entity laser-controls="hand: left" raycaster="objects: .clickable; far: 100;"></a-entity>
      <a-entity laser-controls="hand: right" raycaster="objects: .clickable; far: 100;"></a-entity>
    </a-entity>

  </a-scene>

</body>

</html>
